<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#081225" />
  <meta name="description" content="แผนที่ GTA/FiveM ธีมทางการ" />
  <title>Wind Tactical Map — Viewer</title>

  <link rel="preconnect" href="https://unpkg.com" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      color-scheme: dark;
      --bg: #081225;
      --panel: #0c1b36;
      --panel-soft: #12294f;
      --panel-hover: #19355f;
      --border: #294269;
      --text: #f7f9fd;
      --muted: #aebbd0;
      --accent: #4f8cff;
      --accent-soft: rgba(79, 140, 255, 0.16);
      --accent-gold: #d6b15f;
      --accent-gold-soft: rgba(214, 177, 95, 0.14);
      --success: #3bcf9a;
      --warning: #d6b15f;
      --danger: #ff7d88;
      --shadow: 0 16px 42px rgba(1, 8, 24, 0.38);
      --radius: 14px;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: "Noto Sans Thai", "Leelawadee UI", Tahoma, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    button, input { font: inherit; }
    button { color: inherit; }
    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .app-shell {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 12px;
      padding: 12px;
      background: var(--bg);
    }

    .panel {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .topbar {
      min-height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 12px 11px 16px;
      box-shadow: var(--shadow), inset 0 1px 0 var(--accent-gold-soft);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      border-radius: 11px;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, var(--accent), #315fc0);
      color: #ffffff;
      font-size: 19px;
      font-weight: 900;
      box-shadow: 0 8px 22px rgba(79, 140, 255, 0.28);
    }

    .brand-copy h1 {
      margin: 0;
      font-size: 15px;
      line-height: 1.2;
      letter-spacing: 0.075em;
    }

    .brand-copy h1::after {
      content: "";
      display: inline-block;
      width: 22px;
      height: 2px;
      margin-left: 8px;
      vertical-align: middle;
      border-radius: 999px;
      background: var(--accent-gold);
    }

    .brand-copy p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 11px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .segmented {
      display: inline-flex;
      align-items: center;
      padding: 4px;
      border: 1px solid var(--border);
      background: var(--panel-soft);
      border-radius: 10px;
    }

    .segmented button {
      height: 34px;
      border: 0;
      padding: 0 12px;
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      transition: background .15s;
    }

    .segmented button.active {
      background: var(--accent);
      color: #ffffff;
    }

    .icon-button {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      background: var(--panel-soft);
      border: 1px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
      transition: background .15s;
    }

    .icon-button:hover { background: var(--panel-hover); }

    .workspace {
      min-height: 0;
      display: grid;
      grid-template-columns: 330px minmax(0, 1fr);
      gap: 12px;
      transition: grid-template-columns .2s ease;
    }

    .workspace.sidebar-hidden { grid-template-columns: minmax(0, 1fr); }
    .workspace.sidebar-hidden #sidebar { display: none; }

    .sidebar {
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .sidebar-section {
      padding: 15px;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-section:last-child {
      border-bottom: none;
    }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .section-heading h2 {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .055em;
      text-transform: uppercase;
    }

    .data-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 11px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--warning);
      box-shadow: 0 0 0 4px rgba(245, 185, 66, .11);
    }

    .status-dot.ready {
      background: var(--success);
      box-shadow: 0 0 0 4px rgba(53, 197, 139, .11);
    }

    .status-dot.local {
      background: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-soft);
    }

    .status-dot.error {
      background: var(--danger);
      box-shadow: 0 0 0 4px rgba(239, 98, 98, .11);
    }

    .category-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .category-button {
      min-height: 39px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--panel-soft);
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px;
      cursor: pointer;
      font-size: 12px;
      text-align: left;
    }

    .category-button:hover { background: var(--panel-hover); }
    .category-button.active {
      color: var(--text);
      border-color: rgba(79, 140, 255, .66);
      background: var(--accent-soft);
    }

    .category-label {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
    }

    .category-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex: 0 0 auto;
      background: var(--cat-color, var(--accent));
    }

    .category-count {
      font-family: Consolas, monospace;
      font-size: 10px;
      opacity: .8;
    }

    .data-tools {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }

    .tool-button {
      min-height: 36px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel-soft);
      color: var(--muted);
      cursor: pointer;
      font-size: 11px;
      font-weight: 700;
    }

    .tool-button:hover { background: var(--panel-hover); color: var(--text); }

    .map-panel {
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background: #102b53;
    }

    #map {
      width: 100%;
      height: 100%;
      background: #102b53;
    }

    .leaflet-container {
      font-family: inherit;
      cursor: grab; /* Changed to grab since picking coords is disabled */
    }
    
    .leaflet-container:active {
      cursor: grabbing;
    }

    .leaflet-control-zoom {
      border: 1px solid var(--border) !important;
      border-radius: 10px !important;
      overflow: hidden;
      box-shadow: var(--shadow) !important;
    }

    .leaflet-control-zoom a {
      width: 38px !important;
      height: 38px !important;
      line-height: 38px !important;
      color: var(--text) !important;
      background: rgba(17, 26, 36, .96) !important;
      border-color: var(--border) !important;
    }

    .leaflet-control-zoom a:hover { background: var(--panel-hover) !important; }

    .leaflet-popup-content-wrapper,
    .leaflet-popup-tip {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    .leaflet-popup-content-wrapper { border-radius: 12px; }
    .leaflet-popup-content { margin: 14px 15px; min-width: 180px; }
    .leaflet-popup-close-button { color: var(--muted) !important; }

    .popup-title {
      font-weight: 800;
      font-size: 15px;
      line-height: 1.35;
      margin-bottom: 8px;
    }

    .popup-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 11px;
    }

    .marker-shell {
      position: relative;
      width: 31px;
      height: 31px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,.36);
      background: rgba(8, 18, 37, .94);
      box-shadow: 0 7px 17px rgba(0,0,0,.38), inset 0 0 0 2px rgba(255,255,255,.035);
      transition: transform .15s ease, filter .15s ease;
    }

    .marker-shell:hover { transform: translateY(-2px) scale(1.07); filter: brightness(1.15); }
    .marker-shell img { width: 21px; height: 21px; object-fit: contain; }

    .marker-shell::after {
      content: "";
      position: absolute;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      bottom: 2px;
      right: 2px;
      background: var(--marker-color, var(--accent));
      box-shadow: 0 0 7px var(--marker-color, var(--accent));
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 30px;
      z-index: 2000;
      transform: translate(-50%, 20px);
      opacity: 0;
      pointer-events: none;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 15px;
      background: #111a24;
      color: var(--text);
      box-shadow: var(--shadow);
      transition: opacity .2s ease, transform .2s ease;
      font-size: 12px;
    }

    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    .loading-cover {
      position: fixed;
      inset: 0;
      z-index: 2500;
      display: grid;
      place-items: center;
      background: var(--bg);
      transition: opacity .3s ease, visibility .3s ease;
    }

    .loading-cover.hidden { opacity: 0; visibility: hidden; }
    .loader-box { text-align: center; }

    .loader-ring {
      width: 46px;
      height: 46px;
      margin: 0 auto 14px;
      border: 3px solid rgba(255,255,255,.11);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .85s linear infinite;
    }

    .loader-box strong { display: block; font-size: 14px; }
    .loader-box span { display: block; color: var(--muted); margin-top: 5px; font-size: 11px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 900px) {
      .app-shell { grid-template-rows: auto auto; }
      .workspace, .workspace.sidebar-hidden { grid-template-columns: 1fr; grid-template-rows: auto auto; }
      .map-panel { min-height: 58vh; order: 1; }
      .sidebar { min-height: 200px; order: 2; }
      .workspace.sidebar-hidden #sidebar { display: none; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar panel">
      <div class="brand">
        <div class="brand-mark">W</div>
        <div class="brand-copy">
          <h1>Wind Tactical Map</h1>
          <p id="brandSubtitle">Interactive GTA coordinate map</p>
        </div>
      </div>

      <div class="top-actions">
        <div class="segmented" aria-label="รูปแบบแผนที่">
          <button class="map-style active" data-map="atlas">Atlas</button>
          <button class="map-style" data-map="satellite">Satellite</button>
        </div>
        <button id="toggleSidebar" class="icon-button" title="ซ่อนหรือแสดงแถบด้านข้าง" aria-label="ซ่อนหรือแสดงแถบด้านข้าง">☰</button>
        <button id="resetView" class="icon-button" title="กลับมุมมองเริ่มต้น" aria-label="กลับมุมมองเริ่มต้น">⌂</button>
      </div>
    </header>

    <main id="workspace" class="workspace">
      <aside id="sidebar" class="sidebar panel">
        <section class="sidebar-section">
          <div class="section-heading">
            <h2>หมวดหมู่จุด</h2>
            <div class="data-status">
              <span id="statusDot" class="status-dot"></span>
              <span id="dataStatus">รอข้อมูล</span>
            </div>
          </div>
          <div id="categoryList" class="category-list"></div>
        </section>

        <section class="sidebar-section">
          <div class="section-heading"><h2>จัดการข้อมูล</h2></div>
          <div class="data-tools">
            <button id="importData" class="tool-button" type="button">นำเข้า .json</button>
            <button id="resetData" class="tool-button" type="button">ล้างข้อมูล</button>
          </div>
          <input id="importFile" type="file" accept="application/json,.json" hidden />
        </section>
      </aside>

      <section class="map-panel panel">
        <div id="map" aria-label="แผนที่แบบโต้ตอบ"></div>
      </section>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <div id="loadingCover" class="loading-cover">
    <div class="loader-box">
      <div class="loader-ring"></div>
      <strong>กำลังเตรียมแผนที่</strong>
      <span>โหลดภาพและข้อมูลตำแหน่ง</span>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    "use strict";

    const CONFIG = {
      appName: "Wind Tactical Map",
      assetBaseUrl: "https://raw.githubusercontent.com/godofbom/MapRepport/main/",
      storageKey: "umd-tactical-map-locations-v4", // เปลี่ยน key เพื่อไม่ให้โหลดข้อมูลเก่า
      imageWidth: 8192,
      imageHeight: 8192,
      offsetX: 6487,
      offsetY: 9474,
      minZoom: -4,
      maxZoom: 2,
      focusZoom: 0.4
    };

    const CATEGORY_DEFS = {
      landmark:    { label: "แลนด์มาร์ก", color: "#5bd1c5" },
      resource:    { label: "ทรัพยากร", color: "#d7b968" },
      service:     { label: "บริการ", color: "#76b1ff" },
      medical:     { label: "โรงพยาบาล", color: "#ef7474" },
      police:      { label: "สถานีตำรวจ", color: "#7898ff" },
      agency:      { label: "หน่วยงาน", color: "#b495f4" },
      route:       { label: "เส้นทาง / เหิน", color: "#eea860" },
      underground: { label: "ใต้พิภพ", color: "#b985ed" },
      gas:         { label: "ปั๊มน้ำมัน", color: "#78cc77" },
      general:     { label: "จุดทั่วไป", color: "#c7d3dc" }
    };

    const imageBounds = [[0, 0], [CONFIG.imageHeight, CONFIG.imageWidth]];

    const state = {
      locations: [],
      categoryLayers: new Map(),
      categoryCounts: new Map(),
      activeCategories: new Set(Object.keys(CATEGORY_DEFS)),
      currentBase: "atlas",
      sidebarCollapsed: false,
      dataSource: "empty" // สถานะเริ่มต้นคือว่างเปล่า
    };

    const map = L.map("map", {
      crs: L.CRS.Simple,
      minZoom: CONFIG.minZoom,
      maxZoom: CONFIG.maxZoom,
      zoomSnap: 0.1,
      zoomDelta: 0.5,
      wheelPxPerZoomLevel: 85,
      preferCanvas: true,
      attributionControl: false,
      zoomControl: false,
      maxBounds: [[-900, -900], [CONFIG.imageHeight + 900, CONFIG.imageWidth + 900]],
      maxBoundsViscosity: 0.8
    });

    L.control.zoom({ position: "topleft" }).addTo(map);

    const baseLayers = {
      atlas: { layer: L.imageOverlay(CONFIG.assetBaseUrl + "map.png", imageBounds, { interactive: false }), background: "#0fa8d2" },
      satellite: { layer: L.imageOverlay(CONFIG.assetBaseUrl + "map2.png", imageBounds, { interactive: false }), background: "#143d6b" }
    };

    let currentBaseLayer = baseLayers.atlas.layer.addTo(map);
    map.fitBounds(imageBounds, { animate: false });

    function gtaToLeaflet(gameX, gameY) {
      return [-gameY + CONFIG.offsetY, gameX + CONFIG.offsetX];
    }

    function deterministicId(location, index) {
      const safeIcon = String(location.icon || "0").replace(/[^a-zA-Z0-9_-]/g, "");
      return `source-${index}-${Math.round(Number(location.x) || 0)}-${Math.round(Number(location.y) || 0)}-${safeIcon}`;
    }

    function normalizeLocation(location, index = 0) {
      const x = Number(location?.x);
      const y = Number(location?.y);
      const name = String(location?.name ?? "").trim();
      const icon = String(location?.icon ?? "02").trim();

      if (!name || !Number.isFinite(x) || !Number.isFinite(y) || !icon) return null;

      return {
        id: String(location.id || deterministicId({ x, y, icon }, index)),
        name, x, y, icon
      };
    }

    function normalizeLocations(collection) {
      if (!Array.isArray(collection)) return [];
      return collection.map(normalizeLocation).filter(Boolean);
    }

    function classifyIcon(icon) {
      if (icon === "01") return "medical";
      if (icon === "03") return "police";
      if (icon === "04") return "agency";
      if (icon === "05") return "route";
      if (icon === "06") return "underground";
      if (icon === "22") return "gas";
      if (icon === "02") return "general";

      const numeric = Number(icon);
      if (Number.isFinite(numeric) && numeric >= 1 && numeric <= 10) return "landmark";
      if (Number.isFinite(numeric) && numeric >= 11 && numeric <= 17) return "resource";
      if (Number.isFinite(numeric) && numeric >= 18 && numeric <= 21) return "service";
      return "general";
    }

    function readLocalLocations() {
      try {
        const raw = localStorage.getItem(CONFIG.storageKey);
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        return normalizeLocations(Array.isArray(parsed) ? parsed : parsed.locations);
      } catch (error) {
        return [];
      }
    }

    function loadLocations() {
      const local = readLocalLocations();
      if (local.length) {
        state.dataSource = "local";
        return local;
      }
      state.dataSource = "empty";
      return [];
    }

    function persistLocations() {
      localStorage.setItem(CONFIG.storageKey, JSON.stringify(state.locations));
      state.dataSource = state.locations.length > 0 ? "local" : "empty";
      updateDataStatus();
    }

    function makeMarkerIcon(location) {
      const category = classifyIcon(location.icon);
      const color = CATEGORY_DEFS[category].color;
      const imageUrl = `${CONFIG.assetBaseUrl}${encodeURIComponent(location.icon)}.png`;

      return L.divIcon({
        className: "custom-map-marker",
        html: `<span class="marker-shell" style="--marker-color:${color}"><img src="${imageUrl}" alt="" onerror="this.style.display='none'" /></span>`,
        iconSize: [31, 31],
        iconAnchor: [15, 28],
        popupAnchor: [0, -25]
      });
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function popupHtml(location) {
      const category = classifyIcon(location.icon);
      const categoryLabel = CATEGORY_DEFS[category].label;
      return `
        <div class="popup-title">${escapeHtml(location.name)}</div>
        <div class="popup-meta">
          <span>${escapeHtml(categoryLabel)}</span>
          <span>ICON ${escapeHtml(location.icon)}</span>
        </div>
      `;
    }

    function clearMarkerLayers() {
      state.categoryLayers.forEach(layer => {
        if (map.hasLayer(layer)) map.removeLayer(layer);
        layer.clearLayers();
      });
      state.categoryLayers.clear();
      state.categoryCounts.clear();
    }

    function buildMarkers(locations) {
      clearMarkerLayers();
      Object.keys(CATEGORY_DEFS).forEach((category) => {
        const layer = L.layerGroup();
        state.categoryLayers.set(category, layer);
        state.categoryCounts.set(category, 0);
        if (state.activeCategories.has(category)) layer.addTo(map);
      });

      locations.forEach((location) => {
        const category = classifyIcon(location.icon);
        const [leafletY, leafletX] = gtaToLeaflet(location.x, location.y);
        const marker = L.marker([leafletY, leafletX], {
          icon: makeMarkerIcon(location),
          title: location.name,
          riseOnHover: true,
          keyboard: true
        });

        marker.bindPopup(popupHtml(location), { closeButton: true, autoPanPadding: [70, 90] });
        marker.addTo(state.categoryLayers.get(category));
        state.categoryCounts.set(category, (state.categoryCounts.get(category) || 0) + 1);
      });
    }

    function rebuildAll() {
      buildMarkers(state.locations);
      renderCategories();
      updateDataStatus();
      setTimeout(() => map.invalidateSize(), 0);
    }

    function renderCategories() {
      const container = document.getElementById("categoryList");
      container.innerHTML = "";
      
      if(state.locations.length === 0) {
         container.innerHTML = '<div style="color: var(--muted); font-size: 11px; padding: 10px;">ยังไม่มีจุดบนแผนที่ กรุณานำเข้าไฟล์ .json</div>';
         return;
      }

      Object.entries(CATEGORY_DEFS).forEach(([id, def]) => {
        const count = state.categoryCounts.get(id) || 0;
        if (count === 0) return;

        const button = document.createElement("button");
        button.type = "button";
        button.className = `category-button${state.activeCategories.has(id) ? " active" : ""}`;
        button.dataset.category = id;
        button.innerHTML = `
          <span class="category-label">
            <span class="category-dot" style="--cat-color:${def.color}"></span>
            <span>${def.label}</span>
          </span>
          <span class="category-count">${count}</span>
        `;
        button.addEventListener("click", () => toggleCategory(id, button));
        container.appendChild(button);
      });
    }

    function toggleCategory(category, button) {
      const layer = state.categoryLayers.get(category);
      if (!layer) return;

      if (state.activeCategories.has(category)) {
        state.activeCategories.delete(category);
        if (map.hasLayer(layer)) map.removeLayer(layer);
        button.classList.remove("active");
      } else {
        state.activeCategories.add(category);
        if (!map.hasLayer(layer)) layer.addTo(map);
        button.classList.add("active");
      }
    }

    function switchBaseMap(name) {
      if (!baseLayers[name] || name === state.currentBase) return;
      map.removeLayer(currentBaseLayer);
      currentBaseLayer = baseLayers[name].layer.addTo(map);
      currentBaseLayer.bringToBack();
      state.currentBase = name;
      document.getElementById("map").style.backgroundColor = baseLayers[name].background;

      document.querySelectorAll(".map-style").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.map === name);
      });
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove("show"), 1900);
    }

    function updateDataStatus() {
      const statusDot = document.getElementById("statusDot");
      const dataStatus = document.getElementById("dataStatus");
      const subtitle = document.getElementById("brandSubtitle");
      const countText = `${state.locations.length.toLocaleString("th-TH")} จุด`;

      statusDot.className = "status-dot";

      if (state.dataSource === "local") {
        statusDot.classList.add("local");
        dataStatus.textContent = "บันทึกในเครื่อง";
        subtitle.textContent = `${countText} · โหลดข้อมูลเรียบร้อย`;
      } else if (state.dataSource === "empty") {
        statusDot.classList.add("warning");
        dataStatus.textContent = "รอข้อมูล";
        subtitle.textContent = `0 จุด · รอนำเข้าไฟล์ data.json`;
      }
    }

    async function importData(file) {
      if (!file) return;
      try {
        const text = await file.text();
        const json = JSON.parse(text);
        const imported = normalizeLocations(Array.isArray(json) ? json : json.locations);
        if (!imported.length) throw new Error("ไม่พบข้อมูลจุดที่ถูกต้อง");

        state.locations = imported.map((item, index) => ({
          ...item,
          id: item.id || deterministicId(item, index)
        }));
        persistLocations();
        rebuildAll();
        showToast(`นำเข้า ${imported.length} จุดแล้ว`);
      } catch (error) {
        showToast("นำเข้าไม่สำเร็จ กรุณาตรวจสอบไฟล์ JSON");
      } finally {
        document.getElementById("importFile").value = "";
      }
    }

    function resetData() {
      const accepted = window.confirm("ต้องการลบข้อมูลจุดบนแผนที่ทั้งหมดใช่หรือไม่?");
      if (!accepted) return;

      localStorage.removeItem(CONFIG.storageKey);
      state.locations = [];
      state.dataSource = "empty";
      rebuildAll();
      showToast("ล้างข้อมูลแล้ว");
    }

    function bindEvents() {
      document.querySelectorAll(".map-style").forEach(button => {
        button.addEventListener("click", () => switchBaseMap(button.dataset.map));
      });

      document.getElementById("resetView").addEventListener("click", () => {
        map.closePopup();
        map.fitBounds(imageBounds, { animate: true, duration: .5 });
      });

      document.getElementById("toggleSidebar").addEventListener("click", () => {
        state.sidebarCollapsed = !state.sidebarCollapsed;
        document.getElementById("workspace").classList.toggle("sidebar-hidden", state.sidebarCollapsed);
        setTimeout(() => map.invalidateSize(), 210);
      });

      document.getElementById("importData").addEventListener("click", () => document.getElementById("importFile").click());
      document.getElementById("importFile").addEventListener("change", event => importData(event.target.files?.[0]));
      document.getElementById("resetData").addEventListener("click", resetData);

      window.addEventListener("keydown", event => {
        if (event.key === "Escape") map.closePopup();
      });
    }

    function init() {
      bindEvents();
      document.getElementById("map").style.backgroundColor = baseLayers.atlas.background;

      state.locations = loadLocations();
      buildMarkers(state.locations);
      renderCategories();
      updateDataStatus();

      requestAnimationFrame(() => {
        map.invalidateSize();
        currentBaseLayer.bringToBack();
        document.getElementById("loadingCover").classList.add("hidden");
      });
    }

    init();
  </script>
</body>
</html>
